# Hourly: fill Latitude/Longitude on Meetings whose Address changed, via
# scripts/geocode-meetings.mjs (rules and safety rails documented there).
# The /webhooks/geocode-meeting endpoint is the instant path; this sweep is
# the backfill and safety net behind it.
#
# Uses the same WEBFLOW_WRITE_TOKEN repo secret as the de-indexer.
#
# The schedule only runs on the default branch, so merging to main is what
# turns the hourly sweep on. Pushes to the geocode staging branch run the job
# in draft-only mode (see DRAFT_ONLY below) so real meetings are never touched
# before rollout.
#
# Note: GitHub disables cron schedules in repos with no activity for 60 days;
# any commit re-enables it, and workflow_dispatch always works manually.

name: Geocode meeting addresses

on:
  schedule:
    - cron: '37 * * * *' # hourly at :37
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print plan, write nothing)'
        type: boolean
        default: false
      draft_only:
        description: 'Only touch draft items'
        type: boolean
        default: false
      stamp_existing:
        description: 'One-time migration: stamp geocoded-address on items that already have coordinates (no geocoding)'
        type: boolean
        default: false
  # Pushing changes to the job itself also runs it — doubles as a manual
  # trigger for accounts whose token can't fire workflow_dispatch.
  push:
    branches: [main, geocode]
    paths:
      - 'scripts/geocode-meetings.mjs'
      - '.github/workflows/geocode-meetings.yml'

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Geocode meeting addresses
        env:
          WEBFLOW_WRITE_TOKEN: ${{ secrets.WEBFLOW_WRITE_TOKEN }}
          # Optional; empty until the Google Geocoding key is added as a secret —
          # the script falls back to Nominatim without it.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          # TEMP: pinned on to E2E the stamp migration against the legacy draft.
          STAMP_EXISTING: '1'
          # Anywhere but main only draft items may be written.
          DRAFT_ONLY: ${{ (github.ref != 'refs/heads/main' || inputs.draft_only == true) && '1' || '0' }}
          GEOCODER_CONTACT: 'webmaster@aamanitoba.org'
        run: node scripts/geocode-meetings.mjs
