# Hourly: fill Latitude/Longitude where an Address changed, via
# scripts/geocode-meetings.mjs (rules and safety rails documented there). It
# works on Meetings or on Groups, whichever src/lib/meetings-source.json says is
# live. Two read-only steps follow: after the cutover one watches the frozen
# old collection, and one checks the public list holds every meeting it should.
# The /webhooks/geocode-meeting endpoint is the instant path; this sweep is
# the backfill and safety net behind it.
#
# Uses the same WEBFLOW_WRITE_TOKEN repo secret as the de-indexer.
#
# The schedule only runs on the default branch, so merging to main is what
# turns the hourly sweep on. Pushes to the geocode staging branch run the job
# in draft-only mode (see DRAFT_ONLY below) so real meetings are never touched
# before rollout.
#
# Note: GitHub disables cron schedules in repos with no activity for 60 days;
# any commit re-enables it, and workflow_dispatch always works manually.

name: Geocode meeting addresses

on:
  schedule:
    - cron: '37 * * * *' # hourly at :37
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print plan, write nothing)'
        type: boolean
        default: false
      draft_only:
        description: 'Only touch draft items'
        type: boolean
        default: false
  # Pushing changes to the job itself also runs it — doubles as a manual
  # trigger for accounts whose token can't fire workflow_dispatch.
  push:
    branches: [main, geocode]
    paths:
      - 'scripts/geocode-meetings.mjs'
      - 'scripts/check-legacy-untouched.mjs'
      - 'scripts/check-meetings-health.mjs'
      - 'scripts/lib/meetings-source.mjs'
      # Switching /meetings between v1 and v2 moves the sweep to the other
      # collection; run it right away so the switch is checked, not assumed.
      - 'src/lib/meetings-source.json'
      - '.github/workflows/geocode-meetings.yml'

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: the health check imports the feed route's TypeScript directly.
          node-version: 24
      - name: Geocode meeting addresses
        env:
          WEBFLOW_WRITE_TOKEN: ${{ secrets.WEBFLOW_WRITE_TOKEN }}
          # Optional; empty until the Google Geocoding key is added as a secret —
          # the script falls back to Nominatim without it.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          # Anywhere but main only draft items may be written.
          DRAFT_ONLY: ${{ (github.ref != 'refs/heads/main' || inputs.draft_only == true) && '1' || '0' }}
          GEOCODER_CONTACT: 'webmaster@aamanitoba.org'
        run: node scripts/geocode-meetings.mjs
      # After the cutover the old Meetings collection must stay untouched; an
      # edit there never reaches the website. Read-only; runs even when the
      # geocoder failed.
      - name: Check the old Meetings collection is untouched
        if: ${{ !cancelled() }}
        env:
          WEBFLOW_WRITE_TOKEN: ${{ secrets.WEBFLOW_WRITE_TOKEN }}
        run: node scripts/check-legacy-untouched.mjs
      # The public list must hold every meeting that should be public, from
      # the reader the switch names. Read-only; slugs only in this public log.
      - name: Check the public meeting list is complete
        if: ${{ !cancelled() }}
        env:
          WEBFLOW_WRITE_TOKEN: ${{ secrets.WEBFLOW_WRITE_TOKEN }}
        run: node scripts/check-meetings-health.mjs
